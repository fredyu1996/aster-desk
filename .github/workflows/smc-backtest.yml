name: SMC backtest
# Nightly SMC Trader backtest (report only: never changes live rules). Writes branch "backtest" of the data repo.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smc-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    # Measured locally (Nov 14): year run 365 d = 1172 s (19.5 min wall; loading 32 s, base 84 s, raw 79 s, ablations 75-225 s each).
    # timeout = ceil(1.5 x 19.5) = 30, minimum 45. BT_DEADLINE_MIN = 45 - 10 - 4 (the longest ablation, 3.75 min, can overrun the check).
    timeout-minutes: 45    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backtest the SMC Trader
        run: node bot/backtest.mjs
        env:
          DATA_REPO: ${{ vars.DATA_REPO || 'fredyu1996/aster-desk-data' }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          TZ: America/Creston
          BT_WEEK: '0'   # the nightly 7-day runs are paused (Nov 14); only the year file is written, the old 7-day files stay on the branch
          BT_DEADLINE_MIN: '31'
